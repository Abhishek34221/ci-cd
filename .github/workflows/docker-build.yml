
name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Repository Structure
        run: |
          echo "===== ROOT ====="
          ls -la

          echo "===== FASTAPI ====="
          ls -la ./FastApi_mognodb || true

          echo "===== AMAN TOUR ====="
          ls -la ./aman-tour-travels || true

          echo "===== ALL DOCKERFILES ====="
          find . -type f -name "Dockerfile" -print

      - name: Verify Backend Dockerfile
        run: |
          test -f ./FastApi_mognodb/Dockerfile

      - name: Verify Frontend Dockerfile
        run: |
          test -f ./aman-tour-travels/Dockerfile

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aman-tour-backend:latest \
            ./FastApi_mognodb

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aman-tour-frontend:latest \
            ./aman-tour-travels

      - name: Push Backend Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/aman-tour-backend:latest

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/aman-tour-frontend:latest

