```yaml
name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Project Structure
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Root files and folders:"
          ls -la
          echo ""
          echo "All Dockerfiles:"
          find . -type f -name "Dockerfile" -print

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Backend Dockerfile
        run: |
          if [ ! -f "./FastApi_mognodb/Dockerfile" ]; then
            echo "ERROR: Backend Dockerfile not found!"
            echo "Expected location: ./FastApi_mognodb/Dockerfile"
            exit 1
          fi
          echo "Backend Dockerfile found."

      - name: Verify Frontend Dockerfile
        run: |
          if [ ! -f "./aman-tour-travels/Dockerfile" ]; then
            echo "ERROR: Frontend Dockerfile not found!"
            echo "Expected location: ./aman-tour-travels/Dockerfile"
            exit 1
          fi
          echo "Frontend Dockerfile found."

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aman-tour-backend:latest \
            ./FastApi_mognodb

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aman-tour-frontend:latest \
            ./aman-tour-travels

      - name: Show Docker Images
        run: |
          docker images

      - name: Push Backend Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/aman-tour-backend:latest

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/aman-tour-frontend:latest
```
