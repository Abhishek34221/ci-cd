{% extends "base.html" %}
{% block title %}Sign In | Aman Tour & Travels{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white border border-slate-200/90 rounded-2xl shadow-xl p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-10 h-10 bg-blue-600 rounded-xl mx-auto flex items-center justify-center text-white font-bold text-sm shadow-sm">A</div>
            <h2 class="text-xl font-bold text-slate-900">Sign in to Enterprise Portal</h2>
            <p class="text-xs text-slate-500">Access your dashboard, bookings, and analytics.</p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Enterprise Email Address</label>
                <input type="email" name="email" required placeholder="admin@amantour.io" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-600">
            </div>
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-semibold text-slate-700">Password</label>
                    <a href="#" class="text-[11px] font-semibold text-blue-600 hover:underline">Forgot password?</a>
                </div>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-600">
            </div>

            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-sm shadow-blue-500/20 transition">
                Authenticate & Sign In
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
            Don't have an enterprise account? 
            <a href="{{ url_for('register') }}" class="font-semibold text-blue-600 hover:underline">Register here</a>
        </div>

    </div>
</div>
{% endblock %}
